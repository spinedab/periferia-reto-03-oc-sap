services:
  - type: web
    name: periferia-reto03-agente-oc-sap
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENT_MAX_ITERATIONS
        value: "25"
      - key: SESSION_MAX_TOKENS
        value: "120000"
      - key: CONFIRM_POLICY
        value: prd
